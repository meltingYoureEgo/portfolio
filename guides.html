<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Guides · Abhishek Batham</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Caveat:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#f7f3ed;color:#1c1917;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
  h1,h2,h3,h4{font-family:'Fraunces',serif;letter-spacing:-0.015em}
  .script{font-family:'Caveat',cursive;color:#c65d3b}
  .wrap{max-width:820px;margin:0 auto;padding:0 22px}
  .nav{display:flex;justify-content:space-between;align-items:center;padding:26px 0}
  .brand{font-family:'Fraunces',serif;font-size:22px;font-weight:700;text-decoration:none;color:inherit}
  .btn{background:#c65d3b;color:#fff;padding:12px 24px;border-radius:999px;font-size:14px;font-weight:500;text-decoration:none;transition:all .2s}
  .btn:hover{background:#a84a2d;transform:translateY(-1px)}
  .dotted{border-top:1px dashed #d6cfc4;margin:6px 0 30px}
  .lead{text-align:center;color:#5a5348;font-size:16px;margin-bottom:34px;line-height:1.6;max-width:620px;margin-left:auto;margin-right:auto}
  .search-label{text-align:center;margin-bottom:14px}
  .search-wrap{position:relative;margin-bottom:38px}
  .search-wrap svg{position:absolute;left:20px;top:50%;transform:translateY(-50%);opacity:.5}
  .search{width:100%;padding:18px 20px 18px 54px;border-radius:14px;border:1px solid #e8e0d3;background:#fdfbf8;font-size:15px;font-family:'Inter',sans-serif;outline:none;transition:.2s;color:#1c1917}
  .search:focus{border-color:#c65d3b;box-shadow:0 0 0 4px rgba(198,93,59,.08)}
  .search::placeholder{color:#a89b88}
  .filter-block{margin-bottom:28px}
  .filter-label{font-family:'Caveat',cursive;font-size:23px;color:#c65d3b;margin-bottom:12px;display:block}
  .chips{display:flex;flex-wrap:wrap;gap:10px}
  .chip{padding:9px 18px;border-radius:999px;background:#fdfbf8;border:1px solid #e8e0d3;font-size:13px;color:#6b6355;cursor:pointer;transition:all .18s;user-select:none}
  .chip:hover{border-color:#c65d3b;color:#c65d3b}
  .chip.active{background:#c65d3b;border-color:#c65d3b;color:#fff}
  .count{font-size:13px;color:#8a7f70;margin:28px 0 18px}
  .card{background:#fffdfa;border:1px solid #eee7db;border-radius:18px;padding:24px;margin-bottom:14px;transition:all .25s ease;display:block;text-decoration:none;color:inherit}
  .card:hover{transform:translateY(-3px);box-shadow:0 20px 40px -24px rgba(198,93,59,.35);border-color:#e8d9c5}
  .card h3{font-size:18px;font-weight:600;margin-bottom:14px;line-height:1.35}
  .tags{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .tag{padding:6px 14px;border-radius:999px;font-size:12px;font-weight:500}
  .tag-light{background:#f3ede4;color:#8a7f70;border:1px solid #e8e0d3}
  .tag-solid{background:#c65d3b;color:#fff}
  .read{font-family:'Fraunces',serif;font-size:14px;color:#c65d3b;font-weight:600}
  .empty{text-align:center;padding:60px 20px;color:#8a7f70}
  .footer{text-align:center;padding:40px 0;color:#a89b88;font-size:13px;border-top:1px dashed #d6cfc4;margin-top:40px}
</style>
</head>
<body>
<div class="wrap">

  <div class="nav">
    <a href="index.html" class="brand">Abhishek Batham.</a>
    <a href="https://github.com/meltingYoureEgo" target="_blank" class="btn">View GitHub</a>
  </div>
  <div class="dotted"></div>

  <div class="lead">
    field notes from building and breaking systems.<br>
    filter by what you want to learn, or by the tool you use.
  </div>

  <div class="search-label">
    <span class="script" style="font-size:24px">search the library</span>
  </div>

  <div class="search-wrap">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8a7f70" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" id="search" class="search" placeholder="Try &quot;ghidra&quot;, &quot;burp&quot; or &quot;buffer overflow&quot;">
  </div>

  <div class="filter-block">
    <span class="filter-label">filter by topic</span>
    <div class="chips" id="topic-chips"></div>
  </div>

  <div class="filter-block">
    <span class="filter-label">filter by tool</span>
    <div class="chips" id="tool-chips"></div>
  </div>

  <div class="count" id="count"></div>

  <div id="list"></div>

  <div class="footer">© 2026 Abhishek Batham</div>

</div>

<script>
let GUIDES = [];
let activeTopic = "All";
let activeTool = "All tools";
let query = "";

async function load() {
  try {
    const r = await fetch('guides.json');
    GUIDES = await r.json();
  } catch (e) {
    console.error("Could not load guides.json — make sure you're serving via Live Server, not opening the file directly.", e);
    GUIDES = [
      {title:"Reverse engineering a packed binary with Ghidra",desc:"Full workflow — identifying the packer, dumping, rebuilding imports.",topics:["Reverse Engineering"],tools:["Ghidra","x64dbg"],link:"guides/ghidra-unpacking.html"}
    ];
  }
  buildFilters();
  render();
}

function uniq(a){return [...new Set(a)];}

function buildFilters(){
  const topics = ["All", ...uniq(GUIDES.flatMap(g=>g.topics))];
  const tools  = ["All tools", ...uniq(GUIDES.flatMap(g=>g.tools))];
  const tc = document.getElementById('topic-chips');
  tc.innerHTML = topics.map(t=>`<div class="chip ${t===activeTopic?'active':''}" data-topic="${t}">${t}</div>`).join('');
  const toc = document.getElementById('tool-chips');
  toc.innerHTML = tools.map(t=>`<div class="chip ${t===activeTool?'active':''}" data-tool="${t}">${t}</div>`).join('');
  tc.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{activeTopic=c.dataset.topic;buildFilters();render();});
  toc.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{activeTool=c.dataset.tool;buildFilters();render();});
}

function filtered(){
  return GUIDES.filter(g=>{
    if(activeTopic!=="All" && !g.topics.includes(activeTopic)) return false;
    if(activeTool!=="All tools" && !g.tools.includes(activeTool)) return false;
    if(query){
      const q = query.toLowerCase();
      const hay = (g.title+" "+g.desc+" "+g.topics.join(" ")+" "+g.tools.join(" ")).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

function render(){
  const list = filtered();
  document.getElementById('count').textContent = `Showing ${list.length} of ${GUIDES.length} guides`;
  const el = document.getElementById('list');
  if(!list.length){el.innerHTML = `<div class="empty">no guides match. try a different filter.</div>`;return;}
  el.innerHTML = list.map(g=>`
    <a href="${g.link}" class="card">
      <h3>${g.title}</h3>
      <p style="color:#5a5348;font-size:14px;line-height:1.6;margin-bottom:16px">${g.desc}</p>
      <div class="tags">
        ${g.topics.map(t=>`<span class="tag tag-light">${t}</span>`).join('')}
        ${g.tools.map(t=>`<span class="tag tag-solid">${t}</span>`).join('')}
      </div>
      <span class="read">Read guide →</span>
    </a>
  `).join('');
}

document.getElementById('search').addEventListener('input',e=>{query=e.target.value;render();});
load();
</script>
</body>
</html>
